<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>about</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0e;
      --surface: #161616;
      --border: #222222;
      --text: #e2e2e2;
      --muted: #444;
      --muted-light: #777;
      --nav-width: 240px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    /* ── NAV ── */
    nav {
      width: var(--nav-width);
      min-height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 1.75rem 1rem;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    nav.hidden { display: none; }

    .nav-logo {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted-light);
      text-decoration: none;
      padding: 0 0.5rem;
      margin-bottom: 0.75rem;
      display: block;
    }

    .nav-logo:hover { color: var(--text); }

    .nav-divider {
      height: 1px;
      background: var(--border);
      margin: 0.5rem 0;
    }

    #search {
      width: 100%;
      padding: 0.5rem 0.6rem;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.8rem;
      outline: none;
      font-family: inherit;
      margin-bottom: 0.5rem;
    }

    #search:focus { border-color: #444; }
    #search::placeholder { color: var(--muted); }

    .nav-section-label {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 0.5rem;
      margin: 0.75rem 0 0.35rem;
    }

    #nav-list { list-style: none; }
    #nav-list li a {
      color: var(--muted-light);
      text-decoration: none;
      font-size: 0.82rem;
      display: block;
      padding: 0.3rem 0.5rem;
      text-transform: capitalize;
      border-left: 2px solid transparent;
    }

    #nav-list li a:hover {
      color: var(--text);
      border-left-color: var(--muted);
    }

    #search-results { list-style: none; }
    #search-results li { padding: 0.6rem 0.5rem; border-bottom: 1px solid var(--border); }
    #search-results a {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      text-transform: capitalize;
      display: block;
      margin-bottom: 0.15rem;
    }
    #search-results a:hover { color: #fff; }
    #search-results p {
      color: var(--muted-light);
      font-size: 0.72rem;
      line-height: 1.5;
      margin: 0;
    }

    /* ── MAIN ── */
    main {
      flex: 1;
      max-width: 700px;
      margin: 0 auto;
      padding: 4rem 2.5rem;
    }

    /* index page gets full width */
    body.index-page main {
      max-width: 900px;
    }

    /* ── TYPOGRAPHY ── */
    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.75rem; line-height: 1.2; }
    h2 { font-size: 1.2rem; font-weight: 600; margin: 2.25rem 0 0.5rem; }
    h3 { font-size: 1rem; font-weight: 600; margin: 1.5rem 0 0.4rem; }

    p { margin-bottom: 1rem; color: #aaa; }

    a { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
    a:hover { color: #fff; }

    code {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.82em;
      background: var(--surface);
      color: #ccc;
      padding: 0.15em 0.4em;
      border: 1px solid var(--border);
    }

    pre {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1.25rem 1.5rem;
      overflow-x: auto;
      margin-bottom: 1.25rem;
      font-size: 0.82rem;
      line-height: 1.7;
    }

    pre code { background: none; color: #ccc; padding: 0; border: none; font-size: inherit; }

    blockquote {
      border-left: 2px solid var(--border);
      padding: 0.4rem 0 0.4rem 1rem;
      color: var(--muted-light);
      margin: 1.25rem 0;
      font-style: italic;
    }

    hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
    img { max-width: 100%; margin: 1rem 0; }

    table { width: 100%; border-collapse: collapse; margin-bottom: 1.25rem; font-size: 0.875rem; }
    th, td { padding: 0.6rem 0.875rem; border: 1px solid var(--border); text-align: left; }
    th { background: var(--surface); font-weight: 600; color: var(--text); }
    td { color: #aaa; }

    ul, ol { padding-left: 1.5rem; margin-bottom: 1rem; color: #aaa; }
    li { margin-bottom: 0.25rem; }

    /* ── INDEX PAGE ── */
    .index-header {
      margin-bottom: 3rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 2rem;
    }

    .index-header h1 {
      font-size: 2rem;
      margin-bottom: 0.4rem;
    }

    .index-header p {
      color: var(--muted-light);
      font-size: 0.9rem;
      margin: 0;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }

    .card {
      display: flex;
      flex-direction: column;
      padding: 1.25rem;
      background: var(--bg);
      text-decoration: none;
      transition: background 0.1s;
    }

    .card:hover { background: var(--surface); }

    .card-folder {
      font-size: 0.6rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 0.4rem;
    }

    .card-title {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text);
      text-transform: capitalize;
    }

    /* ── SEARCH HIGHLIGHT ── */
    mark { background: #2a2a2a; color: #fff; padding: 0 2px; }
  </style>
</head>
<body>
  <nav id="sidebar">
    <a class="nav-logo" href="index.html">markform</a>
    <div class="nav-divider"></div>
    <input id="search" type="text" placeholder="Search..." />
    <span class="nav-section-label">Pages</span>
    <ul id="nav-list"><ul><li><a href="about.html">about</a></li>
<li><a href="hello.html">hello</a></li></ul></ul>
    <ul id="search-results" style="display:none;"></ul>
  </nav>
  <main>
    <h1>About</h1>
<p>This site was built with markform.</p>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7/dist/fuse.min.js"></script>
  <script>
    const searchData = [{"title":"about","href":"about.html","content":"About This site was built with markform."},{"title":"hello","href":"hello.html","content":"Hello World This is my first note."}];

    // Hide sidebar on index page
    if (document.title === 'Home') {
      document.getElementById('sidebar').classList.add('hidden');
      document.body.classList.add('index-page');
    }

    const fuse = new Fuse(searchData, {
      keys: ['title', 'content'],
      threshold: 0.1,
      includeScore: true,
      ignoreLocation: true,
      minMatchCharLength: 3,
    });

    function highlight(text, query) {
      if (!query) return text;
      const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      return text.replace(regex, '<mark>$1</mark>');
    }

    function getSnippet(content, query) {
      const idx = content.toLowerCase().indexOf(query.toLowerCase());
      if (idx === -1) return content.slice(0, 120) + '...';
      const start = Math.max(0, idx - 40);
      const end = Math.min(content.length, idx + 100);
      return (start > 0 ? '...' : '') + content.slice(start, end) + (end < content.length ? '...' : '');
    }

    function resolveHref(href) {
      const isFile = window.location.protocol === 'file:';
      if (!isFile) return '/' + href;
      const parts = window.location.pathname.split('/');
      parts.pop();
      return 'file://' + parts.join('/') + '/' + href;
    }

    const searchEl = document.getElementById('search');
    if (searchEl) {
      searchEl.addEventListener('input', function () {
        const query = this.value.trim();
        const navList = document.getElementById('nav-list');
        const results = document.getElementById('search-results');

        if (!query || query.length < 2) {
          navList.style.display = '';
          results.style.display = 'none';
          results.innerHTML = '';
          return;
        }

        const matches = fuse.search(query).slice(0, 8);
        navList.style.display = 'none';
        results.style.display = '';
        results.innerHTML = matches.length
          ? matches.map(m => `
              <li>
                <a href="${resolveHref(m.item.href)}">${highlight(m.item.title, query)}</a>
                <p>${highlight(getSnippet(m.item.content, query), query)}</p>
              </li>`).join('')
          : `<li><p>No results found.</p></li>`;
      });
    }
  </script>
</body>
</html>
